<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard SVO Yogyakarta</title>
<style>
  :root{
    --ground:#f5f5f1;--surface:#fff;--ink:#17181c;--ink-2:#55544f;--muted:#8a8983;
    --hairline:rgba(17,18,20,.09);--border:rgba(17,18,20,.12);
    --brand:#0e7a6e;--brand-soft:#e2f1ee;--brand-ink:#0a5951;
    --shadow:0 1px 2px rgba(17,18,20,.05),0 4px 14px rgba(17,18,20,.05);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
    --ground:#0d0e10;--surface:#17191d;--ink:#f2f2ef;--ink-2:#b8b7af;--muted:#8a8983;
    --hairline:rgba(255,255,255,.09);--border:rgba(255,255,255,.13);
    --brand:#2fb7a6;--brand-soft:#12332f;--brand-ink:#6fd8ca;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --ground:#0d0e10;--surface:#17191d;--ink:#f2f2ef;--ink-2:#b8b7af;--muted:#8a8983;
    --hairline:rgba(255,255,255,.09);--border:rgba(255,255,255,.13);
    --brand:#2fb7a6;--brand-soft:#12332f;--brand-ink:#6fd8ca;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;font-family:var(--sans);background:var(--ground);color:var(--ink);-webkit-font-smoothing:antialiased}
  .top{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--surface);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;box-shadow:var(--shadow)}
  .brand b{font-size:14px;display:block;line-height:1.15;letter-spacing:-.01em}
  .brand span{font-size:11px;color:var(--muted)}
  .switch{display:flex;gap:4px;background:var(--ground);border:1px solid var(--hairline);border-radius:11px;padding:4px}
  .switch button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);padding:8px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .switch button:hover{color:var(--ink)}
  .switch button.active{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow)}
  .theme{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:15px;display:grid;place-items:center}
  .theme:hover{background:var(--ground)}
  .frames{flex:1;position:relative;background:var(--ground)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--ground)}
  iframe.active{display:block}
  @media (max-width:560px){.brand span{display:none}.switch button{padding:8px 12px;font-size:12.5px}}
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo">SVO</div>
      <div><b>SVO Yogyakarta</b><span>Dashboard Terpadu</span></div>
    </div>
    <nav class="switch" role="tablist">
      <button data-f="rekrut" class="active" role="tab">📋 Rekrutmen SE</button>
      <button data-f="iklan" role="tab">📣 Iklan Tim SE</button>
    </nav>
    <button class="theme" id="themeBtn" aria-label="Ganti tema">🌙</button>
  </header>
  <div class="frames">
    <iframe id="f-rekrut" src="rekrut.html" class="active" title="Dashboard Rekrutmen SE"></iframe>
    <iframe id="f-iklan" src="iklan.html" title="Dashboard Iklan Tim SE"></iframe>
  </div>

<script>
(function(){
  var btns = [].slice.call(document.querySelectorAll('.switch button'));
  var frames = { rekrut: document.getElementById('f-rekrut'), iklan: document.getElementById('f-iklan') };
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      btns.forEach(function(x){ x.classList.toggle('active', x === b); x.setAttribute('aria-selected', x===b?'true':'false'); });
      Object.keys(frames).forEach(function(k){ frames[k].classList.toggle('active', k === b.dataset.f); });
    });
  });
  /* theme: satu tombol mengatur shell + kedua iframe (same-origin) */
  var theme = null, tb = document.getElementById('themeBtn');
  function setIframe(f){ if(theme){ try{ f.contentDocument.documentElement.setAttribute('data-theme', theme); }catch(e){} } }
  function apply(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    setIframe(frames.rekrut); setIframe(frames.iklan);
    tb.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  tb.addEventListener('click', function(){
    var cur = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    apply(cur === 'dark' ? 'light' : 'dark');
  });
  frames.rekrut.addEventListener('load', function(){ setIframe(frames.rekrut); });
  frames.iklan.addEventListener('load', function(){ setIframe(frames.iklan); });
})();
</script>
</body>
</html>
